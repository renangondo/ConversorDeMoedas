<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Converso de moedas</title>
</head>

<body>
    <img src="./assets/logo.gif" alt="Logo-devclub-converter">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select>
                <option>US$ Dolar Americano</option>
                <option>€ Euro</option>
            </select>
        </label>

        <label>
            Valor
            <input placeholder="10,000,00">
        </label>

        <button>Converter</button>

        <section>
            <div>
                <img src="./assets/real.png" alt="logo-moeda-a-converter">
                <p>Real</p>
                <p>R$0,00</p>
            </div>

            <img src="./assets/arrow.png" alt="seta-para-baixo">

            <div>
                <img src="./assets/dolar.png" alt="logo-moeda-convertida">
                <p>Dólar</p>
                <p>R$0,00</p>
            </div>
        </section>
    </main>

</body>

</html>
